<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTok Finder — REGAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',sans-serif; background:#0A0A0F; color:#EDEDF2; min-height:100vh; padding:24px 16px 60px; }
  .wrap { max-width:1200px; margin:0 auto; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .brand h1 { font-size:26px; font-weight:700; }
  .brand h1 span { color:#6C63FF; }
  .badge { background:#6C63FF; color:#fff; font-size:10px; font-weight:600; padding:2px 10px; border-radius:20px; text-transform:uppercase; }
  .sub { color:#9CA3AF; font-size:14px; margin-bottom:24px; }
  .bar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .bar input { flex:1; min-width:200px; padding:13px 16px; background:#1C1C2A; border:1px solid #2A2A3E; border-radius:12px; color:#EDEDF2; font-size:14px; outline:none; }
  .bar input:focus { border-color:#6C63FF; }
  .bar button { padding:13px 26px; background:#6C63FF; border:none; border-radius:12px; color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  .bar button:hover { background:#5A52E0; }
  .bar button:disabled { opacity:.5; cursor:not-allowed; }
  #status { margin-bottom:18px; padding:12px 16px; border-radius:12px; font-size:13.5px; display:none; }
  #status.loading { display:block; background:#1C1C2A; color:#9CA3AF; border:1px solid #2A2A3E; }
  #status.ok { display:block; background:rgba(108,99,255,.12); color:#A78BFA; border:1px solid rgba(108,99,255,.25); }
  #status.err { display:block; background:rgba(239,68,68,.12); color:#F87171; border:1px solid rgba(239,68,68,.25); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
  .card { background:#14141E; border:1px solid #2A2A3E; border-radius:14px; overflow:hidden; display:flex; flex-direction:column; transition:transform .15s, border .15s; }
  .card:hover { transform:translateY(-3px); border-color:#3A3A52; }
  .card img { width:100%; aspect-ratio:9/16; object-fit:cover; background:#0A0A0F; display:block; }
  .card .body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card .author { font-size:11px; color:#6C63FF; font-weight:600; }
  .card .meta { font-size:11.5px; color:#9CA3AF; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .actions { display:flex; gap:6px; margin-top:auto; }
  .card .actions a { flex:1; text-align:center; padding:8px 6px; border-radius:9px; font-size:12.5px; font-weight:600; text-decoration:none; }
  .btn-dl { background:#6C63FF; color:#fff; }
  .btn-src { background:#1C1C2A; color:#EDEDF2; border:1px solid #2A2A3E; }
  .spinner { width:32px; height:32px; border:3px solid #2A2A3E; border-top-color:#6C63FF; border-radius:50%; animation:spin .8s linear infinite; margin:50px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .note { margin-top:24px; padding:14px 16px; background:#14141E; border:1px solid #2A2A3E; border-radius:12px; font-size:12.5px; color:#9CA3AF; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>REGAL<span>.</span></h1>
    <span class="badge">TikTok Finder</span>
  </div>
  <p class="sub">Cari video TikTok by keyword. Gratis, tanpa API key.</p>

  <div class="bar">
    <input type="text" id="input" placeholder="contoh: spongebob" autocomplete="off" />
    <button id="btn">Cari</button>
  </div>

  <div id="status"></div>
  <div class="grid" id="grid"></div>

  <div class="note">
    Hasil dari <b>TikXedd API</b> (gratis, no key) via <b>Cloudflare Worker</b> (gratis, 100k req/hari).
    Tombol <b>Download</b> membuka link video di tab baru.
  </div>
</div>

<script>
// ============================================
// GANTI DENGAN URL CLOUDFLARE WORKER LO
// ============================================
const WORKER_URL = 'https://tiktok-proxy.NAMA-LO.workers.dev';
// ============================================

(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const state = { busy:false };

  function status(msg, type){
    const el = $('status');
    el.textContent = msg;
    el.className = type || '';
    el.style.display = 'block';
  }
  function clearStatus(){ $('status').style.display='none'; }

  async function search(keyword){
    const url = `${WORKER_URL}?q=${encodeURIComponent(keyword)}&cursor=0`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  function render(data){
    const grid = $('grid');
    grid.innerHTML = '';

    // TikXedd feed response bisa berbagai bentuk — cari array video
    let items = [];
    if (Array.isArray(data)) items = data;
    else if (data && Array.isArray(data.data)) items = data.data;
    else if (data && Array.isArray(data.videos)) items = data.videos;
    else if (data && Array.isArray(data.result)) items = data.result;
    else if (data && data.data && Array.isArray(data.data.videos)) items = data.data.videos;

    if (!items.length){
      status('Tidak ada hasil. Coba keyword lain.', 'err');
      return;
    }

    status(`✅ ${items.length} video ditemukan.`, 'ok');

    items.forEach(it => {
      const id = it.id || it.video_id || it.aweme_id || '';
      const author = it.author?.uniqueId || it.author?.unique_id || it.author || it.username || 'unknown';
      const desc = it.desc || it.title || it.description || '';
      const cover = it.cover || it.origin_cover || it.dynamic_cover || it.video?.cover || '';
      const videoUrl = it.play || it.video_url || it.download_url || it.video?.play_addr?.url_list?.[0] || '';

      const card = document.createElement('div');
      card.className = 'card';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = desc || 'tiktok';
      img.src = cover || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="355"><rect width="100%" height="100%" fill="%231C1C2A"/></svg>';

      const body = document.createElement('div');
      body.className = 'body';

      const a = document.createElement('div');
      a.className = 'author';
      a.textContent = '@' + author;

      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = desc || '(tanpa deskripsi)';

      const act = document.createElement('div');
      act.className = 'actions';

      const dl = document.createElement('a');
      dl.className = 'btn-dl';
      dl.textContent = '📥 Download';
      dl.target = '_blank';
      dl.rel = 'noopener';
      dl.href = videoUrl || '#';
      if (!videoUrl) { dl.style.opacity = '.3'; dl.style.pointerEvents = 'none'; }

      const src = document.createElement('a');
      src.className = 'btn-src';
      src.textContent = '🔗 Sumber';
      src.target = '_blank';
      src.rel = 'noopener';
      src.href = `https://www.tiktok.com/@${author}/video/${id}`;
      if (!author || !id) { src.style.opacity = '.3'; src.style.pointerEvents = 'none'; }

      act.appendChild(dl);
      act.appendChild(src);
      body.appendChild(a);
      body.appendChild(m);
      body.appendChild(act);
      card.appendChild(img);
      card.appendChild(body);
      grid.appendChild(card);
    });
  }

  async function go(){
    if (state.busy) return;
    const kw = $('input').value.trim();
    if (!kw){ status('Masukkan keyword dulu.', 'err'); return; }

    state.busy = true;
    $('btn').disabled = true;
    $('grid').innerHTML = '<div class="spinner"></div>';
    status('⏳ Mencari...', 'loading');

    try {
      const data = await search(kw);
      render(data);
    } catch(e){
      console.error(e);
      status('❌ ' + e.message, 'err');
      $('grid').innerHTML = '';
    } finally {
      state.busy = false;
      $('btn').disabled = false;
    }
  }

  $('btn').addEventListener('click', go);
  $('input').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  status('📌 Ketik keyword, klik Cari.', 'loading');
})();
</script>
</body>
</html>
